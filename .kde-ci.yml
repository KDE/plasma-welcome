Dependencies:
 - 'on': ['@all']
   'require':
    'frameworks/extra-cmake-modules': 'Frameworks/6.24'
    'frameworks/ki18n': 'Frameworks/6.24'
    'frameworks/kirigami': 'Frameworks/6.24'
    'frameworks/kcoreaddons': 'Frameworks/6.24'
    'frameworks/kdbusaddons': 'Frameworks/6.24'
    'frameworks/kio': 'Frameworks/6.24'
    'frameworks/knewstuff': 'Frameworks/6.24'
    'frameworks/knotifications': 'Frameworks/6.24'
    'frameworks/ksvg': 'Frameworks/6.24'
    'frameworks/kwindowsystem': 'Frameworks/6.24'
    'frameworks/kjobwidgets': 'Frameworks/6.24'
    'frameworks/kuserfeedback': 'Frameworks/6.24'
    'frameworks/kcmutils': 'Frameworks/6.24'
    'plasma/libplasma': '@same'
    'plasma/milou': '@same'
    'libraries/kirigami-addons': 'v1.11.0'

runtime-dependencies:
 'plasma/plasma5support': '@same'
 'plasma/plasma-nm': '@same'

Options:
 require-passing-tests-on: ['Linux', 'FreeBSD']
 run-qmllint: true
